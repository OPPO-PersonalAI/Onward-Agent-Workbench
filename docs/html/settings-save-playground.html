function renderNav(){const nav=document.getElementById('page-nav');if(!nav)return;nav.innerHTML=pages.map(id=>`<button type="button" id="nav-${id}" data-page="${id}" ${id===page?'aria-current="page"':''} ${saving?'disabled':''}>${esc(t(id))}${id===page&&dirty()?'<span class="dirty-dot" aria-hidden="true"></span>':''}</button>`).join('');document.getElementById('category-select').value=page;document.getElementById('category-select').disabled=saving;}
function renderStatus(){const isDirty=isOpen&&dirty();app.setAttribute('aria-busy',String(saving));document.getElementById('state-label').textContent=!isOpen?'closed':saving?'saving':status==='saveFailed'?'error':isDirty?'dirty':'clean';const badge=document.getElementById('dirty-label');if(badge)badge.hidden=!isDirty;const footer=document.getElementById('footer-status');if(!footer)return;const key=saving?'saving':recording?'recordingStatus':status||(isDirty?'dirtyStatus':'noChanges');footer.dataset.tone=status==='saveFailed'||status==='validationStatus'?'error':status==='saved'?'saved':isDirty?'dirty':'clean';footer.innerHTML=`${isDirty&&!saving&&!status&&!recording?'● ':''}${esc(t(key))}<small>${esc(t(status==='saveFailed'?'retryHint':recording?'recordingHint':'scopeStatus',{page:t(page)}))}</small>`;document.getElementById('save-page').disabled=saving||!isDirty||Boolean(recording);document.getElementById('save-page').innerHTML=saving?`<span class="spinner" aria-hidden="true"></span>${esc(t('saving'))}`:esc(t('save'));document.getElementById('discard-page').disabled=saving||!isDirty||Boolean(recording);document.getElementById('fields').disabled=saving;document.getElementById('close-settings').disabled=saving;document.getElementById('settings-search').disabled=saving;document.getElementById('locale').disabled=saving;}
function renderPreview(){if(page==='shortcuts'){const container=document.getElementById('action-preview');if(container)container.innerHTML=draft.actions.filter(action=>action.visible).map(action=>`<span>${esc(actionLabel(action))}</span>`).join('')||`<p>${esc(t('noVisible'))}</p>`;app.querySelectorAll('[data-select-action]').forEach(button=>{const action=draft.actions.find(item=>item.id===button.dataset.selectAction);if(action){button.querySelector('span').textContent=actionLabel(action);button.classList.toggle('is-hidden',!action.visible);}});}else if(page==='appearance'){const preview=document.getElementById('theme-preview'),theme=themes[draft.theme];preview.style.background=theme.bg;preview.style.color=theme.text;preview.innerHTML=`<div class="preview-label" style="color:inherit;opacity:.75">${esc(t('localPreview'))}</div><div class="sample-code">$ onward dev\n<span style="color:${draft.accent}">●</span> ${esc(t('terminalLabel'))} · Ready\n<span style="opacity:.65">const workspace = 'yours';</span></div>`;}else if(page==='fonts'){const sample=document.getElementById('font-preview'),font=draft.tasks[selectedTask];sample.style.fontFamily='"'+font.family+'", monospace';sample.style.fontSize=Math.max(10,Math.min(30,Number(font.size)||14))+'px';sample.textContent=t('fontSample')+'\n$ onward dev';}}
function renderLive(){const theme=themes[saved.appearance.theme],font=saved.fonts.tasks.one,action=saved.shortcuts.actions.find(item=>item.visible);document.getElementById('live').innerHTML=`<div class="live-workspace" style="background:${theme.bg};color:${theme.text}"><div class="fake-dots">● ● ●</div><div class="sample-code" style="font-family:'${font.family}',monospace;font-size:${font.size}px">$ onward dev\n<span style="color:${saved.appearance.accent}">●</span> ${saved.general.language==='en'?'Workspace ready':'工作区已就绪'}\n<span style="opacity:.65">${saved.general.language==='en'?'Waiting for your next idea.':'等待你的下一个想法。'}</span></div></div><div class="live-bindings">${[['activate',saved.shortcuts.global||t('notSet')],['liveAction',action?actionLabel(action):t('noVisible')],['liveTheme',t(saved.appearance.theme)],['liveFont',font.size+' px'],['liveLanguage',saved.general.language==='en'?'English':'简体中文'],['liveDiagnostics',t(saved.general.diagnostics?'enabled':'disabled')]].map(([label,value])=>`<div class="live-row"><span>${esc(t(label))}</span><strong>${esc(value)}</strong></div>`).join('')}</div>`;}
function edited(wasDirty){status='';errors=[];renderErrors();renderStatus();renderNav();renderPreview();if(!wasDirty&&dirty())log('logDirty',{page});}
function renderErrors(){const box=document.getElementById('form-errors');if(!box)return;app.querySelectorAll('[aria-invalid]').forEach(node=>{node.removeAttribute('aria-invalid');node.removeAttribute('aria-describedby');});box.hidden=errors.length===0;box.innerHTML=errors.length?`<strong>${esc(t('validationStatus'))}</strong><ul>${errors.map(error=>`<li>${esc(t(error.key))}</li>`).join('')}</ul>`:'';for(const error of errors){const field=document.getElementById('field-'+error.path);if(field){field.setAttribute('aria-invalid','true');field.setAttribute('aria-describedby','form-errors');}}}
const normalizedKey=value=>String(value).replace(/\s/g,'').toLowerCase().replaceAll('control','ctrl').replaceAll('command','meta').replaceAll('cmd','meta').replaceAll('option','alt');
function validate(){const found=[];if(page==='shortcuts'){if(!Number.isInteger(Number(draft.timeout))||Number(draft.timeout)<500||Number(draft.timeout)>10000)found.push({key:'errorTimeout',path:'timeout'});if(!draft.leader)found.push({key:'errorLeader',path:'leader'});const global=normalizedKey(draft.global),leader=normalizedKey(draft.leader);if(global&&(global===leader||draft.actions.some(action=>normalizedKey(action.shortcut)===global)))found.push({key:'errorConflict',path:'global'});const seen=new Set();draft.actions.forEach((action,index)=>{if(!action.name.trim()&&!action.preset)found.push({key:'errorAction',path:`actions.${index}.name`});const key=normalizedKey(action.shortcut);if(key&&(key===leader||seen.has(key)))found.push({key:'errorDuplicate',path:`actions.${index}.shortcut`});if(key)seen.add(key);});}else if(page==='fonts'){for(const [task,font] of Object.entries(draft.tasks))for(const field of ['size','editorSize'])if(!Number.isInteger(Number(font[field]))||Number(font[field])<10||Number(font[field])>30)found.push({key:'errorFont',path:`tasks.${task}.${field}`});}return found;}
function showValidation(){const first=errors[0];if(first?.path.startsWith('actions.'))selectedAction=draft.actions[Number(first.path.split('.')[1])]?.id??selectedAction;if(first?.path.startsWith('tasks.'))selectedTask=first.path.split('.')[1];renderApp();for(const error of errors){const field=document.getElementById('field-'+error.path);if(field){const details=field.closest('details');if(details)details.open=true;}}const field=first&&document.getElementById('field-'+first.path);field?.focus();field?.scrollIntoView({block:'nearest',behavior:'instant'});}
async function savePage(destination=null){if(saving||recording||!dirty())return;errors=validate();if(errors.length){status='validationStatus';pending=null;showValidation();log('logInvalid');return;}const snapshot=clone(draft),savingPage=page,willFail=document.getElementById('fail-next').checked;document.getElementById('fail-next').checked=false;saving=true;status='';renderStatus();renderNav();await new Promise(resolve=>setTimeout(resolve,600));saving=false;document.getElementById('locale').disabled=false;if(willFail){status='saveFailed';pending=null;renderStatus();renderNav();log('logFailed');return;}saved[savingPage]=snapshot;draft=clone(snapshot);status='saved';renderStatus();renderNav();renderLive();log('logSave',{page:savingPage});if(destination)navigate(destination);}
function discardPage(){if(saving||recording)return;draft=clone(saved[page]);errors=[];status='discarded';log('logDiscard',{page});const scroll=document.getElementById('content')?.scrollTop??0;renderApp();document.getElementById('content').scrollTop=scroll;document.getElementById('page-heading').focus({preventScroll:true});}
function navigate(destination){pending=null;recording=null;query='';errors=[];status='';if(destination.close){isOpen=false;renderApp();log('logClosed');return;}page=destination.page;draft=clone(saved[page]);renderApp();log('logOpen',{page});if(destination.target){const details=app.querySelector('[data-group="actions"]');if(details)details.open=true;details?.scrollIntoView({block:'nearest',behavior:'instant'});}document.getElementById('page-heading')?.focus({preventScroll:true});}
function requestLeave(destination){if(saving||dialog.open)return;if(recording)cancelRecording();if(destination.page===page){query='';document.getElementById('settings-search').value='';renderSearch();if(destination.target){const group=app.querySelector('[data-group="actions"]');if(group){group.open=true;group.scrollIntoView({block:'nearest',behavior:'instant'});group.querySelector('summary').focus();}}return;}if(!dirty()){navigate(destination);return;}pending=destination;restoreFocusId=document.activeElement?.id??'';renderNav();document.getElementById('dialog-title').textContent=t('leaveTitle',{page:t(page)});document.getElementById('dialog-description').textContent=destination.close?t('closeDescription'):t('leaveDescription',{page:t(destination.page)});document.getElementById('keep-editing').textContent=t('keepEditing');document.getElementById('leave-discard').textContent=t('leaveWithout');document.getElementById('leave-save').textContent=t('saveLeave');dialog.showModal();document.getElementById('keep-editing').focus();log('logGuard',{page});}
function keepEditing(){pending=null;dialog.close();document.getElementById(restoreFocusId)?.focus({preventScroll:true});log('logStay',{page});}
function renderSearch(){const results=document.getElementById('search-results');if(!results)return;const term=query.trim().toLowerCase();results.hidden=!term;if(!term)return;const entries=pages.map(id=>({page:id,label:t(id),words:id+' '+t(id)}));entries.push({page:'shortcuts',target:'actions',label:t('actionsGroup'),words:'prompt action shortcut 输入 动作 快捷键'});const matches=entries.filter(entry=>(entry.words+' '+entry.label).toLowerCase().includes(term));results.innerHTML=matches.length?matches.map(entry=>`<button type="button" data-page="${entry.page}" ${entry.target?'data-target="actions"':''}>${esc(entry.label)}</button>`).join(''):`<p>${esc(t('noResults'))}</p>`;}
function cancelRecording(){if(!recording)return;const field=document.getElementById('field-'+recording);if(field){field.classList.remove('recording');field.textContent=readPath(draft,recording)||t('notSet');}recording=null;renderStatus();}
function recordShortcut(path){if(saving)return;cancelRecording();recording=path;const field=document.getElementById('field-'+path);field.classList.add('recording');field.textContent=t('pressKeys');field.focus();renderStatus();}
app.addEventListener('input',event=>{const target=event.target;if(target.id==='settings-search'){query=target.value;renderSearch();return;}if(!target.dataset.path||saving)return;const wasDirty=dirty();let value=target.type==='checkbox'?target.checked:target.value;if(target.type==='number'&&target.value!==''&&Number.isFinite(Number(target.value)))value=Number(target.value);writePath(draft,target.dataset.path,value);edited(wasDirty);});
app.addEventListener('change',event=>{const target=event.target;if(target.id==='category-select'){const next=target.value;target.value=page;requestLeave({page:next});}else if(target.hasAttribute('data-select-task')){cancelRecording();selectedTask=target.value;renderApp();document.getElementById('selected-task').focus();}});
app.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled||saving)return;if(button.dataset.page){requestLeave({page:button.dataset.page,target:button.dataset.target});return;}if(button.dataset.record){recordShortcut(button.dataset.record);return;}if(button.dataset.selectAction){cancelRecording();selectedAction=button.dataset.selectAction;const scroll=document.getElementById('content').scrollTop;renderApp();document.getElementById('content').scrollTop=scroll;app.querySelector(`[data-select-action="${selectedAction}"]`)?.focus();return;}if(button.dataset.theme){const wasDirty=dirty();draft.theme=button.dataset.theme;app.querySelectorAll('[data-theme]').forEach(node=>node.setAttribute('aria-pressed',String(node.dataset.theme===draft.theme)));edited(wasDirty);return;}const command=button.dataset.command;if(command==='close')requestLeave({close:true});else if(command==='reopen'){isOpen=true;navigate({page});}else if(command==='save')void savePage();else if(command==='discard')discardPage();else if(command==='check-updates')document.getElementById('update-result').textContent=t('upToDate');else if(command==='apply-fonts'){const wasDirty=dirty(),font=clone(draft.tasks[selectedTask]);for(const id of Object.keys(draft.tasks))draft.tasks[id]=clone(font);edited(wasDirty);}else if(['add-action','delete-action','move-left','move-right'].includes(command)){cancelRecording();const wasDirty=dirty(),index=draft.actions.findIndex(action=>action.id===selectedAction),scroll=document.getElementById('content').scrollTop;if(command==='add-action'){const action={id:'custom-'+(++actionCounter),name:t('newAction')+' '+actionCounter,preset:null,shortcut:'',visible:true,includePrompt:true};draft.actions.push(action);selectedAction=action.id;}else if(command==='delete-action'){draft.actions.splice(index,1);selectedAction=draft.actions[Math.max(0,index-1)]?.id??'';}else{const next=index+(command==='move-left'?-1:1);if(next>=0&&next<draft.actions.length)[draft.actions[index],draft.actions[next]]=[draft.actions[next],draft.actions[index]];}edited(wasDirty);renderApp();document.getElementById('content').scrollTop=scroll;if(command==='add-action')document.getElementById(`field-actions.${draft.actions.length-1}.name`)?.focus();}});
document.addEventListener('keydown',event=>{if(event.isComposing||event.keyCode===229)return;if(recording){event.preventDefault();event.stopPropagation();if(event.key==='Escape'){cancelRecording();return;}if(['Control','Meta','Alt','Shift'].includes(event.key))return;const wasDirty=dirty(),path=recording;let key=event.code?.startsWith('Key')?event.code.slice(3):event.code?.startsWith('Digit')?event.code.slice(5):event.key===' '?'Space':event.key.length===1?event.key.toUpperCase():event.key;const parts=[];if(event.ctrlKey)parts.push('Ctrl');if(event.metaKey)parts.push('Meta');if(event.altKey)parts.push('Alt');if(event.shiftKey)parts.push('Shift');const clear=event.key==='Backspace'&&parts.length===0;writePath(draft,path,clear?'':[...parts,key].join('+'));cancelRecording();edited(wasDirty);return;}if(dialog.open)return;if(!isOpen||!app.contains(document.activeElement))return;if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();void savePage();}else if(event.key==='Escape'){event.preventDefault();if(query){query='';document.getElementById('settings-search').value='';renderSearch();}else requestLeave({close:true});}else if(event.key==='Enter'&&document.activeElement.id==='settings-search'){const match=document.querySelector('#search-results button');if(match){event.preventDefault();match.click();}}},true);
window.addEventListener('blur',cancelRecording);
app.addEventListener('focusout',event=>{if(recording&&event.target.id==='field-'+recording)cancelRecording();});
dialog.addEventListener('cancel',event=>{event.preventDefault();keepEditing();});
document.getElementById('keep-editing').addEventListener('click',keepEditing);
document.getElementById('leave-discard').addEventListener('click',()=>{const destination=pending;if(!destination)return;log('logDiscard',{page});dialog.close();navigate(destination);});
document.getElementById('leave-save').addEventListener('click',()=>{const destination=pending;if(!destination)return;dialog.close();pending=null;void savePage(destination);});
document.getElementById('locale').addEventListener('click',()=>{if(saving)return;cancelRecording();const scroll=document.getElementById('content')?.scrollTop??0;locale=locale==='en'?'zh-CN':'en';localize();if(document.getElementById('content'))document.getElementById('content').scrollTop=scroll;});
document.getElementById('widths').addEventListener('click',event=>{const button=event.target.closest('[data-width]');if(!button)return;requestedWidth=Number(button.dataset.width);app.style.width=requestedWidth+'px';document.querySelectorAll('[data-width]').forEach(node=>node.setAttribute('aria-pressed',String(Number(node.dataset.width)===requestedWidth)));});
const tocLinks=[...document.querySelectorAll('#toc a')];
function updateToc(){let current=tocLinks[0];for(const link of tocLinks)if(document.querySelector(link.getAttribute('href')).getBoundingClientRect().top<=130)current=link;for(const link of tocLinks)if(link===current)link.setAttribute('aria-current','true');else link.removeAttribute('aria-current');}
window.addEventListener('scroll',updateToc,{passive:true});
window.addEventListener('resize',updateToc);
localize();log('logOpen',{page});updateToc();
</script>
